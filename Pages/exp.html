<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth Notion Widgets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="exp.css">
</head>

<body>
    <canvas id="starfield"></canvas>

    <header class="header">
        <div class="logo-container">
            <img src="../Asset/sethhero.svg" alt="Seth Logo" class="logo-icon">
            <span class="logo-text">Seth notion widgets</span>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-link">Features</a>
            <a href="#" class="nav-link">Pricing</a>
            <a href="#" class="nav-link">Blog</a>
            <div class="nav-item-dropdown">
                <a href="#" class="nav-link">Resources <span class="arrow">⌄</span></a>
            </div>
        </nav>
        <div class="header-cta">
            <a href="#" class="btn btn-dark-sm">Contact us<span class="download-icon">+</span></a>
        </div>
    </header>

    <main class="main-content">

        <nav class="tab-navigation">
            <a href="#" class="tab-link active" data-category="clock">Clock</a>
            <a href="#" class="tab-link" data-category="calendar">Calendar</a>
            <a href="#" class="tab-link" data-category="weather">Weather</a>
            <a href="#" class="tab-link" data-category="other">Other</a>
        </nav>

        <div class="widget-grid">

            <!-- Clock Widget 1 -->
            <div class="widget-card">
                <div class="widget-preview">
                    <iframe src="../Asset/Clock/clk1.html" class="preview-frame" frameborder="0"
                        scrolling="no"></iframe>
                </div>
                <button class="btn copy-btn" data-widget-url="../Asset/Clock/clk1.html">
                    Copy link
                </button>
            </div>

            <!-- Clock Widget 2 -->
            <div class="widget-card">
                <div class="widget-preview">
                    <iframe src="../Asset/Clock/clk2.html" class="preview-frame" frameborder="0"
                        scrolling="no"></iframe>
                </div>
                <button class="btn copy-btn" data-widget-url="../Asset/Clock/clk2.html">
                    Copy link
                </button>
            </div>

            <!-- Clock Widget 3 -->
            <div class="widget-card">
                <div class="widget-preview">
                    <iframe src="../Asset/Clock/clk3.html" class="preview-frame" frameborder="0"
                        scrolling="no"></iframe>
                </div>
                <button class="btn copy-btn" data-widget-url="../Asset/Clock/clk3.html">
                    Copy link
                </button>
            </div>

            <!-- Clock Widget 4 -->
            <div class="widget-card">
                <div class="widget-preview">
                    <span class="widget-icon">Sethu</span>
                </div>
                <button class="btn copy-btn" data-widget-url="https://notion-widgets.seth.com/clock/world">
                    Copy link
                </button>
            </div>

            <!-- Wide Widget 1 -->
            <div class="widget-card wide">
                <div class="widget-preview">
                    <span class="widget-icon">📅</span>
                </div>
                <button class="btn copy-btn" data-widget-url="https://notion-widgets.seth.com/calendar/monthly">
                    Copy link
                </button>
            </div>

            <!-- Wide Widget 2 -->
            <div class="widget-card wide">
                <div class="widget-preview">
                    <span class="widget-icon">📊</span>
                </div>
                <button class="btn copy-btn" data-widget-url="https://notion-widgets.seth.com/calendar/timeline">
                    Copy link
                </button>
            </div>

            <!-- Additional Widgets -->
            <div class="widget-card">
                <div class="widget-preview">
                    <span class="widget-icon">🌤️</span>
                </div>
                <button class="btn copy-btn" data-widget-url="https://notion-widgets.seth.com/weather/current">
                    Copy link
                </button>
            </div>

            <div class="widget-card">
                <div class="widget-preview">
                    <span class="widget-icon">🌡️</span>
                </div>
                <button class="btn copy-btn" data-widget-url="https://notion-widgets.seth.com/weather/forecast">
                    Copy link
                </button>
            </div>

            <div class="widget-card">
                <div class="widget-preview">
                    <span class="widget-icon">💡</span>
                </div>
                <button class="btn copy-btn" data-widget-url="https://notion-widgets.seth.com/other/quotes">
                    Copy link
                </button>
            </div>

            <div class="widget-card">
                <div class="widget-preview">
                    <span class="widget-icon">✨</span>
                </div>
                <button class="btn copy-btn" data-widget-url="https://notion-widgets.seth.com/other/motivational">
                    Copy link
                </button>
            </div>

        </div>
    </main>

    <script src="exp.js"></script>
</body>

</html>
